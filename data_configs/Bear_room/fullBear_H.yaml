root_path: ./data/Bear_room/time_series_temperature
spliter: timestamp
# spliter: ratio
split_info: # "7:1:2"
  - '2020-06-01'
  - '2020-09-01'
  - '2020-10-01'
  - '2020-10-20'  # Discard the data after 10-20
timestamp_col: Timestamp
target: all
id_info: id_info.json
id: # all
  - '104'
  # - '105'
  # - '107'
  # - '108'
  # - '110'
  # - '114'
  # - '120'
  # - '121'
  # - '122'
formatter: '{i}.parquet'
# downsample: 12
sampling_rate: 5min  # 1h
base_T: 288  # 24