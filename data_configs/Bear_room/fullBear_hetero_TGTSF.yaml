root_path: ./data/Bear_room/time_series
spliter: timestamp
# spliter: ratio
split_info: # "7:1:2"
  - '2020-09-03'
  - '2020-10-03'
timestamp_col: Timestamp
target: all
  # - Zone Temperature
id_info: id_info.json
id: all
formatter: '{i}.parquet'
sampling_rate: 5min
base_T: 288
hetero_info:
  root_path: ./data/Bear_room/hetero/weather/report_embedding/formal_report
  formatter: wm_messages_v1_embeddings.pkl
  matching: backward
  input_format: embedding
  static_path: static_info_embeddings.pkl