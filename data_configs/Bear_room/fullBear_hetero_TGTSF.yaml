root_path: ./data/Bear_room/time_series
spliter: timestamp
# spliter: ratio
split_info: # "7:1:2"
  - '2020-06-01'  # Discard the data before 06-01
  - '2020-09-01'
  - '2020-10-01'
  - '2020-10-20'  # Discard the data after 10-20
timestamp_col: Timestamp
target: all
id_info: id_info.json
id: # all
  - '104'
  - '107'
  - '108'
  - '120'
  - '122'
  - '208'
  - '216'
  - '229'
  - '248'
  - '252'
  - '261'
  - '281'
  - '288'
  - '304'
  - '317'
  - '329'
  - '345'
  - '348'
  - '362'
  - '380'
  - '387'
  - '403'
  - '417'
  - '428'
  - '445'
  - '450'
  - '461'
  - '470'
  - '484'
formatter: '{i}.parquet'
# downsample: 12
sampling_rate: 5min  # 1h
base_T: 288  # 24
hetero_info:
  hetero_type: all_for_one  # all_for_one, each_subset
  # root_path: ./data/Bear_room/hetero/room/report_embedding/formal_report
  root_path: ./data/Bear_room/hetero/weather/report_embedding/formal_report
  # formatter: all.pkl  # all.pkl  flow.pkl  temperature.pkl  occupy.pkl
  formatter: wm_messages_v1.pkl
  # matching: single
  matching: backward
  input_format: embedding
  static_path: static_info_embeddings.pkl