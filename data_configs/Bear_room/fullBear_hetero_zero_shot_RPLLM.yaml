root_path: ./data/Bear_room/time_series
spliter: timestamp
# spliter: ratio
split_info: # "7:1:2"
  - '2020-06-01'  # Discard the data before 06-01
  - '2020-09-01'
  - '2020-10-01'
  - '2020-10-20'  # Discard the data after 10-20
timestamp_col: Timestamp
target: all
id_info: id_info.json
id: # all
  - '110'
  - '121'
  - '221'
  - '254'
  - '350'
  - '371'
  - '423'
  - '436'
formatter: '{i}.parquet'
# downsample: 12
sampling_rate: 5min  # 1h
base_T: 288  # 24
hetero_info:
  hetero_type: all_for_one  # all_for_one, each_subset
  sampling_rate: 1day
  root_path: ./data/Bear_room/hetero/weather/weather_report/formal_report
  formatter: wm_messages_v1.json
  matching: single
  postemb: True
  postemb_model: bert-base-uncased
  postemb_max_len: 16
  postemb_d: 768
  postemb_batch_size: 200
  input_format: json
  static_path: static_info.json