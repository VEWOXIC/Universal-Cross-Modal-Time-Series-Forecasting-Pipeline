root_path: ./data/California_ISO/time_series
spliter: timestamp
# spliter: ratio
split_info: # "7:1:2"
  - '2021-01-01'
  - '2022-01-01'
timestamp_col: Time
target: all
  # - value
id_info: id_info.json
id: all
formatter: '{i}.parquet'
sampling_rate: 5min
base_T: 288
hetero_info:
  sampling_rate: 1day
  root_path: ./data/California_ISO/weather/san-diego/weather_report/formal_report
  formatter: fast_general_formal_forecast_????.json
  matching: single
  input_format: json
  static_path: static_info.json
