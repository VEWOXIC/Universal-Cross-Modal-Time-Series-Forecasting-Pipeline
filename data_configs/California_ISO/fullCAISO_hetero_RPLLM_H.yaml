root_path: ./data/California_ISO/time_series
spliter: timestamp
# spliter: ratio
split_info: # "7:1:2"
  - '2021-01-01'
  - '2022-01-01'
timestamp_col: Time
target: all
id_info: id_info_except_battery.json
id:
  - "all_except_battery"  # "all"
formatter: '{i}.parquet'
downsample: 12
sampling_rate: 1h
base_T: 24
hetero_info:
  hetero_type: all_for_one
  sampling_rate: 1day
  root_path: ./data/California_ISO/weather
  formatter: merged_general_weather_forecast.json
  matching: single
  postemb: True
  postemb_model: /bert-base-uncased
  postemb_max_len: 16
  postemb_d: 768
  postemb_batch_size: 200
  input_format: json
  static_path: static_info_except_battery.json
