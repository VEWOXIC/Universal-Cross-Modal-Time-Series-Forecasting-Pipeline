root_path: ./data/California_ISO/time_series
spliter: timestamp
# spliter: ratio
split_info: # "7:1:2"
  - '2021-01-01'
  - '2022-01-01'
timestamp_col: Time
target: all
  # - value
id_info: id_info_except_battery.json
id: all
formatter: '{i}.parquet'
downsample: 12
sampling_rate: 1h
base_T: 24
hetero_info:
  root_path: ./data/California_ISO/weather/merged_report_embedding
  formatter: fast_general_formal_embeddings_????.pkl
  matching: backward
  input_format: embedding
  static_path: static_info_embeddings_except_battery.pkl
