root_path: ./data/Canada_photovoltaics_plants/time_series
spliter: timestamp
# spliter: ratio
split_info: # "7:1:2"
  - '2021-01-01'
  - '2022-01-01'
timestamp_col: date
target: all
  # - kWh
id_info: id_info_imputed.json
id: all
formatter: 'id_{i}.parquet'
sampling_rate: 1h
base_T: 24
hetero_info:
  sampling_rate: 1day
  root_path: ./data/Canada_photovoltaics_plants/weather/calgary/weather_report/formal_report
  formatter: fast_general_formal_forecast_????.json
  matching: single
  input_format: json
  static_path: static_info.json
