root_path: ./data/Germany_Renewable_Power_Grid/impute_data
spliter: timestamp
# spliter: ratio
split_info: # "7:1:2"
  - '2015-01-01' # discard data before 2015
  - '2021-01-01'
  - '2022-01-01'
  - '2025-02-26' # fit the requirements in data_helper.py
timestamp_col: time
target: all
id_info: id_info.json
id: all
formatter: '{i}.parquet'
downsample: 4
sampling_rate: 1h
base_T: 24
time_zone: Europe/Berlin
hetero_info:
  hetero_type: all_for_one
  sampling_rate: 1day
  root_path: ./data/Germany_Renewable_Power_Grid/weather
  formatter: merged_fast_general_weather_forecast.json
  matching: single
  postemb: True
  postemb_model: /home/lcm/caiwanxu/bert-base-uncased
  postemb_max_len: 16
  postemb_d: 768
  postemb_batch_size: 200
  input_format: json
  static_path: static_info.json
