root_path: ./data/Jena_Atmospheric_Physics/time_series
spliter: timestamp
# spliter: ratio
split_info: # "7:1:2"
  - '2021-01-01'
  - '2022-01-01'
timestamp_col: Date Time
target: all
  # - value
id_info: id_info.json
id: all
formatter: '{i}.parquet'
downsample: 6
sampling_rate: 1h
base_T: 24
hetero_info:
  hetero_type: all_for_one
  sampling_rate: 1day
  root_path: ./data/Jena_Atmospheric_Physics/weather/weather_report/general_report
  formatter: fast_general_weather_forecast_????.json
  matching: single
  postemb: True
  postemb_model: /home/lcm/caiwanxu/bert-base-uncased
  postemb_max_len: 16
  postemb_d: 768
  postemb_batch_size: 200
  input_format: json
  static_path: static_info.json
