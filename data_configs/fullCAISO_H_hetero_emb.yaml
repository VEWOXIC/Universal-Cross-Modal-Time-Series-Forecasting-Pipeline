root_path: ./data/California_ISO/time_series
spliter: timestamp
# spliter: ratio
split_info: # "7:1:2"
  - '2021-01-01'
  - '2022-01-01'
timestamp_col: Time
target: all
  # - 
id_info: id_info.json
id: all
formatter: '{i}.parquet'

downsample: 12
sampling_rate: 1h
base_T: 24

hetero_info:
  root_path: ./data/California_ISO/weather/san-diego/weather_report/formal_report
  formatter: fast_general_formal_forecast_????.json
  matching: backward  # single  # default backward for 1day sampling
  input_format: json
  static_path: static_info.json
